<!DOCTYPE html>
<html lang="pt-br">

<head>

    <!-- META -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- TÍTULO -->
    <title>
        {% block title %}
            Laboratório do Pascal
        {% endblock %}
    </title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<!-- ================= TOPO ================= -->

<header class="topo">

    <div class="logo-area">

        <!-- botão mobile -->
        <span class="menu-mobile"
              onclick="toggleMenu()">

            ☰

        </span>

        <!-- logo -->
        <div class="logo">

            Laboratório do Pascal

        </div>

    </div>

    <!-- LOGIN -->
    <div class="login">

        {% if session.usuario %}

            <a href="/logout">

                Logout ({{ session.usuario }})

            </a>

        {% else %}

            <a href="/login">

                Login

            </a>

        {% endif %}

    </div>

</header>

<!-- ================= MENU ================= -->

<nav class="menu" id="menu">

    <ul>

        <!-- SIMULAÇÕES -->
        <li class="menu-item">

            <span>Simulações</span>

            <div class="dropdown">

                <a href="/teste">

                    Teste

                </a>

            </div>

        </li>

        <!-- FÍSICA -->
        <li class="menu-item">

            <span>Física</span>

            <div class="dropdown">

                <a href="/">

                    Eletricidade e Magnetismo

                </a>

            </div>

        </li>

        <!-- SOBRE -->
        <li class="menu-item">

            <a href="#">

                Sobre

            </a>

        </li>

    </ul>

</nav>

<!-- ================= CONTEÚDO ================= -->

<main class="conteudo">

    {% block content %}

    {% endblock %}

</main>

<!-- ================= RODAPÉ ================= -->

<footer class="rodape">

    <button onclick="scrollTopo()">

        ⬆ Voltar ao topo

    </button>

</footer>

<!-- ================= JS ================= -->

<script src="{{ url_for('static', filename='js/main.js') }}"></script>

<script src="{{ url_for('static', filename='js/p5.min.js') }}"></script>

{% block scripts %}

{% endblock %}

</body>
</html>
